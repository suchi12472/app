apiVersion: apps/v1
kind: Deployment
metadata: 
  name: nginx-deploy
spec:
  replicas: 5
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
        name: pod-1
        labels:
          app: demo
    spec:
      containers:
        - name: cont-1
          image: mysql:8.0
          ports:
            - containerPort: 80
