apiVersion: apps/v1
kind: Deployment
metadata: 
  name: sql-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
        name: pod-1
        labels:
          app: demo
    spec:
      containers:
        - name: cont-1
          image: nginx:latest
          ports:
            - containerPort: 80
